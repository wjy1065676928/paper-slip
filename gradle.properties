# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# AndroidX package structure
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# Optimization settings
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
kotlin.incremental=true
kotlin.incremental.java=true
org.gradle.parallel=true
org.gradle.caching=true

# Use KSP2 for better compatibility with Kotlin 2.x and AGP 9.0
ksp.useKSP2=true

# 🚀 开启 R8 完全模式：极致瘦身和性能优化
android.enableR8.fullMode=true

org.gradle.caching.debug=false

# 🚀 Compose 编译器指标
android.enableComposeCompilerMetrics=false
android.enableComposeCompilerReports=false

# 🚀 Kotlin 守护进程
kotlin.daemon.jvm.options=-Xmx4g
kotlin.incremental.useClasspathSnapshot=true

# 🚀 资源优化：移除未使用的备用资源和语言
android.resourceOptimizations.enabled=true

# 使用 AGP 默认的原生库压缩
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
