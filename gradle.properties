# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# AndroidX package structure
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# Optimization settings
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
kotlin.incremental=true
kotlin.incremental.java=true
org.gradle.parallel=true
org.gradle.caching=true

# Fix for "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed" with AGP 9.0+
# This is currently required for KSP and other plugins to work with AGP 9.0's new Kotlin handling.
android.disallowKotlinSourceSets=false

# Use KSP2 for better compatibility with Kotlin 2.x and AGP 9.0
ksp.useKSP2=true

# 🚀 开启 R8 完全模式：极致瘦身和性能优化
android.enableR8.fullMode=true

org.gradle.caching.debug=false
android.enableComposeCompilerMetrics=true
android.enableComposeCompilerReports=true
kotlin.daemon.jvm.options=-Xmx4g
kotlin.incremental.useClasspathSnapshot=true